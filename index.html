<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The real logo asset, not a traced approximation. 32px for the tab, 180/192 for
         home-screen icons. Sized ahead of time so the browser never downscales a 500px PNG
         into a 16px tab slot. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D0D0D" />
    <title>Stake</title>
    <meta
      name="description"
      content="Stake stocks on Robinhood Chain. Every fee generated by our token is used to purchase stocks which are distributed proportionally to stakers."
    />

    <!-- Link previews. Crawlers read only this static HTML, never the rendered app, so these are
         the home-page values on every URL — a deeper route shared on X or Telegram still previews
         as Stake rather than as nothing. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://stakeonpons.xyz/" />
    <meta property="og:site_name" content="Stake" />
    <meta property="og:title" content="Stake" />
    <meta
      property="og:description"
      content="Stake stocks on Robinhood Chain. Every fee generated by our token is used to purchase stocks which are distributed proportionally to stakers."
    />
    <meta property="og:image" content="https://stakeonpons.xyz/logo.png" />
    <meta property="og:image:width" content="500" />
    <meta property="og:image:height" content="500" />
    <!-- "summary", not "summary_large_image": the logo is square, and a wide card would letterbox
         it with empty space either side. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Stake" />
    <meta
      name="twitter:description"
      content="Stake stocks on Robinhood Chain. Every fee generated by our token is used to purchase stocks which are distributed proportionally to stakers."
    />
    <meta name="twitter:image" content="https://stakeonpons.xyz/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter is Pons's own --font-sans. IBM Plex Mono stays for addresses and figures: Pons names
         no monospace, and a proportional font would let digits shift width between renders. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
